name: Release

# Собирает VideoCompressor.exe без Python на машине пользователя.
# Запускается при пуше тега vX.Y.Z или вручную (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller "dearpygui>=2.3"

      - name: Build EXE
        run: python -m PyInstaller VideoCompressor.spec --noconfirm --clean

      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path dist\VideoCompressor.exe -DestinationPath VideoCompressor-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VideoCompressor-win64
          path: VideoCompressor-win64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VideoCompressor-win64.zip
          generate_release_notes: true
